name: macOS WidgetKit Build Check

on:
  workflow_dispatch:
    inputs:
      legacy_probe:
        description: Isolated SiriKit configuration probe (not production)
        type: boolean
        default: false
  push:
    branches: [codex/macos-stage-baseline]
    paths:
      - .github/workflows/macos-widget-check.yml
      - scripts/build-macos-widgets.py
      - src-tauri/native/widgets/**

permissions:
  contents: read

jobs:
  widget-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Record toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --find appintentsmetadataprocessor
          security find-identity -v -p codesigning
      - name: Build unsigned extension and validate metadata
        env:
          LEGACY_PROBE: ${{ inputs.legacy_probe }}
        run: |
          if [ "$LEGACY_PROBE" = "true" ]; then
            python3 scripts/build-macos-widgets.py --compile-only --legacy-probe
          else
            python3 scripts/build-macos-widgets.py --compile-only
          fi
      - name: Upload build-check artifacts (not an installable widget)
        uses: actions/upload-artifact@v4
        with:
          name: FolioWidgets-unsigned-build-check
          path: local-build/widget-ci/
          if-no-files-found: error
