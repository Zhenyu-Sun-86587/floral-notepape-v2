name: Stage verified macOS release
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful macOS Folio Release run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify producer identity and successful result
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg repo "$GH_REPO" '.conclusion == "success" and .path == ".github/workflows/macos-release.yml" and .head_repository.full_name == $repo' "$RUNNER_TEMP/source-run.json"
      - uses: actions/download-artifact@v4
        with:
          name: Folio-macOS-ad-hoc-widgets
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: staging
      - name: Verify checksum and stage draft only
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path('staging')
          report = json.loads(next(root.rglob('PRIVATE_WIDGET_BUILD_REPORT.json')).read_text())
          version = report['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert report['production'] and report['signing'] == 'ad-hoc'
          dmg = root / f'Folio_{version}_aarch64.dmg'
          expected = (root / 'Folio_SHA256SUMS.txt').read_text().split()[0]
          digest = hashlib.sha256(dmg.read_bytes()).hexdigest()
          assert digest == expected, 'DMG checksum mismatch'
          producer = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'source-run.json').read_text())
          build = dict(version=version, source_sha=producer['head_sha'], run_id=producer['id'],
                       run_url=producer['html_url'], dmg_sha256=digest, signing='ad-hoc')
          info = root / 'BUILD_INFO.json'
          info.write_text(json.dumps(build, indent=2)+'\n')
          sums = root / 'SHA256SUMS.txt'
          sums.write_text(f'{digest}  {dmg.name}\n')
          tag = 'mac-v' + version
          common = ['-R', os.environ['GH_REPO']]
          existing = subprocess.run(['gh', 'release', 'view', tag, *common, '--json', 'isDraft'], capture_output=True, text=True)
          if existing.returncode == 0:
              assert json.loads(existing.stdout)['isDraft'], 'Never overwrite a published release'
          else:
              subprocess.run(['gh', 'release', 'create', tag, *common, '--draft', '--target', producer['head_sha'],
                              '--title', f'笺影 Mac {version}', '--notes', '构建及自动检查通过。正在安装与验收，尚未正式发布。'], check=True)
          subprocess.run(['gh', 'release', 'upload', tag, *common, str(dmg), str(info), str(sums), '--clobber'], check=True)
          PY
