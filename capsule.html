<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>收纳便签</title>
    <script>
      var option = localStorage.getItem("theme-option");
      document.documentElement.dataset.theme =
        option === "light" || option === "dark"
          ? option
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/capsule.tsx"></script>
  </body>
</html>
